name: Browser app — test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Engine unit tests
        run: npm test
      - name: Browser end-to-end test
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 &
          sleep 2
          npm run e2e
      - name: Package the website
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p _site
          cp -r web/index.html web/app.js web/styles.css web/engine web/reference _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Needs GitHub Pages switched on once: Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
