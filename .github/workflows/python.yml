name: Server and ML tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt jsonschema
      - name: Model server tests
        run: cd backend && pytest -q
      - name: Dataset converter tests
        run: cd ml && pytest -q tests
